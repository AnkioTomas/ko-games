name: release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3 zip
      - name: Test
        run: lua5.3 spec/run.lua
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/package.sh "${GITHUB_REF_NAME}"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/games.koplugin-*.zip
          generate_release_notes: true
